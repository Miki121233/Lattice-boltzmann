name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LatticeBoltzmann.slnx

      - name: Build
        run: dotnet build LatticeBoltzmann.slnx -c Release --no-restore

      - name: Test
        run: dotnet test LatticeBoltzmann.slnx -c Release --no-build

      - name: Publish
        run: dotnet publish src/LatticeBoltzmann.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/win-x64

      - uses: actions/upload-artifact@v7
        with:
          name: LatticeBoltzmann-win-x64
          path: artifacts/win-x64/LatticeBoltzmann.App.exe
          if-no-files-found: error
